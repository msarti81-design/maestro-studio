name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java 21
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Capacitor CLI & Platform
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Add Android Platform (if not present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Web Build to Capacitor Android
        run: npx cap sync android

      - name: Configure Android Settings (Fullscreen, Permissions, Java 21 & Kotlin Stdlib)
        run: python3 scripts/configure_android.py

      - name: Resolve Kotlin Stdlib Classpath Conflicts
        run: |
          if ! grep -q "kotlin-stdlib-jdk8" android/app/build.gradle; then
            cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                          }
                      }
                  }
              }
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-apk/Maestro-Piano-Studio.apk
            echo "APK pronto: release-apk/Maestro-Piano-Studio.apk"
          else
            echo "Errore: APK non trovato!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-Piano-Studio-APK
          path: release-apk/Maestro-Piano-Studio.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Maestro Piano Studio APK v1.0.${{ github.run_number }}"
          body: |
            ### 🎹 Maestro Piano Studio - Versione Android APK
            Compilazione completata con successo!
            Scarica il file **`Maestro-Piano-Studio.apk`** sottostante e installalo direttamente su tablet o smartphone Android.
          files: release-apk/Maestro-Piano-Studio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
