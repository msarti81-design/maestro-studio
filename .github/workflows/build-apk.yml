name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Purge Old Artifacts Before Build (Prevent 0.5GB Quota Error)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /repos/${{ github.repository }}/actions/artifacts?per_page=100 --paginate -q '.artifacts[].id' 2>/dev/null | while read aid; do
            gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$aid 2>/dev/null || true
          done
          gh api /repos/${{ github.repository }}/actions/caches --paginate -q '.actions_caches[].id' 2>/dev/null | while read cid; do
            gh api -X DELETE /repos/${{ github.repository }}/actions/caches/$cid 2>/dev/null || true
          done

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D esbuild

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java 21
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Capacitor CLI & Platform
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Clean, Add & Sync Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Copy Persistent Release Keystore
        run: |
          mkdir -p android/app
          cp release.jks android/app/release.jks

      - name: Configure Android Settings (Fullscreen, Permissions, Java 21 & Kotlin Stdlib)
        run: python3 scripts/configure_android.py

      - name: Inject VirtuKeys Official App Icons into Android Mipmaps
        run: node scripts/update_android_icons.cjs

      - name: Resolve Kotlin Stdlib Classpath Conflicts
        run: |
          if ! grep -q "kotlin-stdlib-jdk8" android/app/build.gradle; then
            cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                          }
                      }
                  }
              }
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          fi

      - name: Build Debug APK & Signed Release AAB with Gradle
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare Artifacts Output
        run: |
          mkdir -p release-output
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/VirtuKeys.apk
            echo "APK pronto: release-output/VirtuKeys.apk"
          fi
          AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" release-output/VirtuKeys.aab
            echo "AAB pronto (Signed Release): release-output/VirtuKeys.aab"
          fi

      - name: Read App Version from versionInfo.ts
        id: ver
        run: |
          APP_VER=$(python3 -c "import re; s=open('src/utils/versionInfo.ts').read(); m=re.search(r\"APP_VERSION\s*=\s*['\\\"]([^'\\\"]+)['\\\"]\", s); print(m.group(1) if m else '1.0.233')")
          V_CODE=$(python3 -c "p='$APP_VER'.split('.'); print(int(p[0])*10000 + int(p[1])*100 + int(p[2]))")
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (100% Private & Unlimited Storage - 0MB Actions Quota)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}-b${{ github.run_number }}"
          name: "VirtuKeys v${{ steps.ver.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            ### 🎹 VirtuKeys Studio Android Package v${{ steps.ver.outputs.version }} (`versionCode: ${{ steps.ver.outputs.version_code }}`)
            - **VirtuKeys.apk**: Ready to install directly on Android devices (full English UI, 13 Studio keyboard themes, 14 scrollable visual FX, chunked MP4/WebM video download, top-pinned title editor).
            - **VirtuKeys.aab**: **Signed Release App Bundle (`versionCode ${{ steps.ver.outputs.version_code }}`, `versionName "${{ steps.ver.outputs.version }}"`)** ready for Google Play Console.
          files: |
            release-output/VirtuKeys.apk
            release-output/VirtuKeys.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

